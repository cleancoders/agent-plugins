name: Build plugin dist

on:
  push:
    branches: [master]
    paths:
      - 'plugins/*/src/**'
      - 'plugins/*/test/**'
      - 'plugins/*/VERSION'
      - 'plugins/*/tsconfig.json'
      - 'plugins/*/package.json'
      - 'plugins/*/package-lock.json'

# This workflow commits synced version files and pushes release tags, so it
# needs write. Declared explicitly rather than inherited: without a permissions
# block the token gets the repo default, which is broader than the two things
# this job actually does.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned: this job publishes plugin bundles and tags releases, so a
      # compromised floating tag on a third-party action could tamper with what
      # every developer's marketplace installs.
      #
      # artipacked is suppressed, not fixed. persist-credentials stays ENABLED
      # because this job pushes commits and tags — unlike a scan-only job, it
      # needs the credential zizmor would have it discard. Nothing here uploads
      # an artifact, which is the leak path that audit actually warns about.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24) # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (node24)
        with:
          # 22 LTS. No plugin declares an engines constraint and the build is a
          # plain npm ci / test / build, so this is a straight bump off EOL 20.
          node-version: '22'

      - name: Run bash tests
        run: |
          for test_file in test/*_test.sh; do
            echo "Running ${test_file}"
            bash "${test_file}"
          done

      - name: Sync versions
        run: |
          MARKETPLACE_JSON=".claude-plugin/marketplace.json"
          for plugin_dir in plugins/*/; do
            if [ -f "${plugin_dir}VERSION" ]; then
              echo "Syncing version for ${plugin_dir}"
              bash scripts/sync-versions.sh "${plugin_dir%/}" "${MARKETPLACE_JSON}"
            fi
          done

      - name: Test and build plugins
        run: |
          for plugin_dir in plugins/*/; do
            if [ -f "$plugin_dir/package.json" ]; then
              echo "Testing and building $plugin_dir"
              cd "$plugin_dir"
              npm ci
              npm test
              npm run build
              cd "$GITHUB_WORKSPACE"
            fi
          done

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/*/dist/bundle.js plugins/*/.claude-plugin/plugin.json plugins/*/package.json plugins/*/src/index.ts .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync versions and build plugins [skip ci]"
            git push
          fi

      - name: Tag new versions
        run: |
          for plugin_dir in plugins/*/; do
            if [ -f "${plugin_dir}VERSION" ]; then
              name="$(basename "${plugin_dir}")"
              version="$(cat "${plugin_dir}VERSION" | tr -d '[:space:]')"
              tag="${name}/v${version}"
              if ! git rev-parse "${tag}" >/dev/null 2>&1; then
                echo "Creating tag ${tag}"
                git tag "${tag}"
              fi
            fi
          done
          git push --tags
